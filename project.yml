name: MyWidgets
options:
  bundleIdPrefix: systems.holonic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: JHV8UWZS57
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    PROVISIONING_PROFILE_SPECIFIER: ""
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "19"

targets:
  MyWidgets:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.holonic.MyWidgets
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: "My Widgets"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MyWidgetsWidget
        embed: true

  MyWidgetsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.holonic.MyWidgets.Widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        INFOPLIST_FILE: Widget/Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
