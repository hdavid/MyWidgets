name: MyWidgets
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    macOS: "14.0"
    # 17.0 is the floor for AppIntentConfiguration, which is what lets one
    # widget kind be placed many times with a different source in each.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "25"

# Two multiplatform targets — one app and one widget extension, each building for
# both macOS and iOS from the same sources. Platform differences live in the
# source behind `#if os(macOS)` (the menu-bar panel, the login item, and Claude
# usage, which needs the `security` CLI) rather than in per-platform targets.
#
# What must still be conditioned per SDK is anything Apple defines differently:
#   signing      Developer ID + hardened runtime for direct Mac distribution;
#                automatic signing on iOS, where a device needs a profile.
#   App Group    macOS requires the Team ID prefix, iOS requires a "group."
#                prefix and no team — so each platform gets its own entitlements.
targets:
  MyWidgets:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.${APP_NAME}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "My Widgets"
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        # macOS: Developer ID, hardened runtime — what notarization requires.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": entitlements/macOS.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""
        "OTHER_CODE_SIGN_FLAGS[sdk=macosx*]": "--timestamp"
        "CODE_SIGN_INJECT_BASE_ENTITLEMENTS[sdk=macosx*]": "NO"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        "ARCHS[sdk=macosx*]": "arm64 x86_64"
        "INFOPLIST_KEY_LSUIElement[sdk=macosx*]": "NO"
        "INFOPLIST_KEY_NSHumanReadableCopyright[sdk=macosx*]": ""
        # iOS: Xcode manages the profile.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": entitlements/iOS.entitlements
        "CODE_SIGN_STYLE[sdk=iphone*]": Automatic
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": "YES"
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": "YES"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphone*]": "UIInterfaceOrientationPortrait"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # An explicit plist rather than GENERATE_INFOPLIST_FILE: the document-type and
    # exported-UTI declarations are nested arrays of dictionaries, which the
    # INFOPLIST_KEY_* build settings cannot express.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "My Widgets"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Own the config file type, so a shared .mywidgets file opens here.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).config
            UTTypeDescription: My Widgets configuration
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [mywidgets]
        CFBundleDocumentTypes:
          - CFBundleTypeName: My Widgets configuration
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [$(PRODUCT_BUNDLE_IDENTIFIER).config]
        # iOS: let the Files app and the share sheet hand the file over directly.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    dependencies:
      - target: MyWidgetsWidget
        embed: true

  MyWidgetsWidget:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.${APP_NAME}.Widget
        # One plist for both platforms: it only substitutes build settings and
        # declares the WidgetKit extension point.
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": entitlements/macOSWidget.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""
        "OTHER_CODE_SIGN_FLAGS[sdk=macosx*]": "--timestamp"
        "CODE_SIGN_INJECT_BASE_ENTITLEMENTS[sdk=macosx*]": "NO"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        "ARCHS[sdk=macosx*]": "arm64 x86_64"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": entitlements/iOSWidget.entitlements
        "CODE_SIGN_STYLE[sdk=iphone*]": Automatic
