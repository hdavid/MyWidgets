name: MyWidgets
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    macOS: "14.0"
    # 17.0 is the floor for AppIntentConfiguration, which is what lets one
    # widget kind be placed many times with a different source in each.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "22"

targets:
  # ── macOS ───────────────────────────────────────────────────────────────────
  # Signed with a Developer ID for direct distribution (not the App Store), so
  # manual signing plus the hardened runtime, which notarization requires.
  MyWidgets:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.${APP_NAME}
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: "My Widgets"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MyWidgetsWidget
        embed: true

  MyWidgetsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - PhoneWidgetBundle.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.${APP_NAME}.Widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: "NO"
        INFOPLIST_FILE: Widget/Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "NO"

  # ── iOS / iPadOS ────────────────────────────────────────────────────────────
  # Automatic signing: unlike the Mac build there's no Developer ID path — a
  # device install needs a provisioning profile, which Xcode manages.
  #
  # Excluded from both iOS targets:
  #   SelfFetch.swift        shells out to `security`; no iOS equivalent
  #   UsageWidget.swift      depends on SelfFetch
  #   MyWidgetsApp.swift     MenuBarExtra / SMAppService / NSWorkspace
  #   AccountSettingsView    needs UsageAppModel from MyWidgetsApp.swift
  MyWidgetsPhone:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          # Generated by configure.sh; consumed by the build, not a resource.
          - PhoneWidget-Info.plist
          - iOSApp.entitlements
          - iOSWidget.entitlements
      - path: App
        excludes:
          - MyWidgetsApp.swift
          - AccountSettingsView.swift
          - App.entitlements
          # macOS-only icon sizes; iOS has its own catalog under iOS/
          - Assets.xcassets
      - path: Shared
        excludes:
          - SelfFetch.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.${APP_NAME}.ios
        CODE_SIGN_ENTITLEMENTS: iOS/iOSApp.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "My Widgets"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MyWidgetsPhoneWidget
        embed: true

  MyWidgetsPhoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - MacWidgetBundle.swift
          - UsageWidget.swift
          - Info.plist
          - Widget.entitlements
      - path: Shared
        excludes:
          - SelfFetch.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.${APP_NAME}.ios.Widget
        CODE_SIGN_ENTITLEMENTS: iOS/iOSWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "My Widgets"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSExtension_Generation: "NO"
    info:
      path: iOS/PhoneWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  MyWidgets:
    build:
      targets:
        MyWidgets: all
  MyWidgetsPhone:
    build:
      targets:
        MyWidgetsPhone: all
